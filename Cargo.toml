[package]
name = "histcite-mac"
version = "0.3.6"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Local bibliometric analysis with familiar HistCite workflows"
repository = "https://github.com/yangnim21029/histcite-mac"

[lib]
name = "histcite_core"

[[bin]]
name = "histcite-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"


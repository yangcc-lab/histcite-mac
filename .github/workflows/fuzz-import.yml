name: WoS import fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '52 3 * * 1'

permissions:
  contents: read

concurrency:
  group: fuzz-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the collection importer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the ClusterFuzzLite image
        run: docker build --file .clusterfuzzlite/Dockerfile --tag histcite-fuzz .
      - name: Run the instrumented importer with the public WoS example
        run: |
          docker run --rm -e FUZZING_LANGUAGE=rust -e SANITIZER=address histcite-fuzz bash -euc '
            compile
            corpus=$(mktemp -d)
            unzip -q "$OUT/wos_import_seed_corpus.zip" -d "$corpus"
            cd "$OUT"
            ./wos_import "$corpus" -max_total_time=45 -max_len=32768 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
          '

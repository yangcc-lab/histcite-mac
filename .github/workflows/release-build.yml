name: Attested macOS build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Universal DMG
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release source and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import json; print(json.load(open("desktop/tauri.conf.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify package
        run: |
          rustup default stable
          python3 scripts/build_macos.py --universal
          codesign --verify --strict --all-architectures 'dist/HistCite Mac.app'
          python3 scripts/package_dmg.py
          cp examples/demo-wos.txt dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            dist/HistCite-Mac-${{ steps.version.outputs.value }}-universal.dmg
            dist/SHA256SUMS.txt
            dist/demo-wos.txt

  attest:
    name: Attest and verify Universal DMG
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DMG: HistCite-Mac-${{ needs.build.outputs.version }}-universal.dmg
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-build
      - name: Check the downloaded package checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DMG" =~ ^HistCite-Mac-[0-9]+\.[0-9]+\.[0-9]+-universal\.dmg$ ]]
          sha256sum "$DMG" | cmp SHA256SUMS.txt -
      - name: Generate build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.DMG }}
      - name: Verify provenance against the file and source revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE" "$DMG.intoto.jsonl"
          gh attestation verify "$DMG" --bundle "$DMG.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-macos-build
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.intoto.jsonl
            SHA256SUMS.txt
            demo-wos.txt

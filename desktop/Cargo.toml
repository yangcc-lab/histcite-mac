[package]
name = "histcite-desktop"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "HistCite-style bibliometric analysis for macOS"
repository = "https://github.com/yangnim21029/histcite-mac"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
histcite-mac = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

serde = { version = "1", features = ["derive"] }
base64 = "0.22"
urlencoding = "2"
